name: Test

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

concurrency:
  group: test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}

    env:
      DB_DRIVER: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: skeleton_test
      DB_USERNAME: skeleton
      DB_PASSWORD: skeleton
      DB_CHARSET: utf8mb4
      DB_COLLATION: utf8mb4_unicode_ci

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: skeleton_test
          MYSQL_USER: skeleton
          MYSQL_PASSWORD: skeleton
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql
          coverage: xdebug

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run database migrations
        run: vendor/bin/phinx migrate --no-interaction

      - name: Run unit tests
        run: vendor/bin/phpunit
